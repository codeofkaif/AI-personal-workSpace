name: Frontend build

on:
  push:
    branches: [main, "fix/**", "feat/**"]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
