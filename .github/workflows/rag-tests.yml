name: RAG regression tests

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "rag-service/**"
      - ".github/workflows/rag-tests.yml"
  pull_request:
    paths:
      - "rag-service/**"
      - ".github/workflows/rag-tests.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag-service/requirements.txt
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip fastapi python-multipart pytest
      - name: Compile Python source
        run: python -m py_compile main.py reindex_documents.py evaluate_retrieval.py
      - name: Run unit tests
        run: pytest -q
