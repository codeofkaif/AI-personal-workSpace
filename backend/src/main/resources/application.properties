# ===== Server =====
server.port=8080
spring.application.name=ai-personal-workspace

# ===== PostgreSQL Database =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_workspace}
spring.datasource.username=${DB_USER:kaifkhan}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-production-2026}
app.jwt.expiration-ms=86400000

# ===== FastAPI (AI/RAG Service) =====
app.rag.base-url=${RAG_BASE_URL:http://localhost:8000}
app.rag.api-key=${RAG_API_KEY:}

# ===== CORS =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
