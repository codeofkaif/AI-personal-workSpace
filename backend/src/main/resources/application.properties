# ===== Server =====
server.port=8080
spring.application.name=ai-personal-workspace

# ===== PostgreSQL Database =====
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_workspace
spring.datasource.username=kaifkhan
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# ===== JWT =====
app.jwt.secret=ai-workspace-super-secret-jwt-key-change-in-production-must-be-long-enough-2026
app.jwt.expiration-ms=86400000

# ===== FastAPI (AI/RAG Service) =====
app.rag.base-url=http://localhost:8000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://192.168.1.85:3000
